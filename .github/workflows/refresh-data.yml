# Fresh-data pipeline: download the newest CDC PLACES tract release (plus Census boundaries and
# RUCA codes), rebuild the data files, check them against the previous build, run the tests,
# commit the new data and republish the site.
#
# Run it by hand: Actions -> Refresh data -> Run workflow (optionally give a Socrata dataset id).
# It also runs on the 1st of every month. If a sanity check or a test fails, nothing is committed
# and the live site keeps the previous data; the refresh report is still uploaded as an artifact.
name: Refresh data
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "PLACES Socrata dataset id (blank = newest tract release found on data.cdc.gov)"
        required: false
        default: ""
  schedule:
    - cron: "17 9 1 * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh-data
jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Keep the previous build for comparison
        run: cp data/healthlens_data.js /tmp/old_data.js
      - name: Download fresh data
        working-directory: pipeline
        run: |
          if [ -n "${{ github.event.inputs.dataset }}" ]; then
            python download.py --force --dataset "${{ github.event.inputs.dataset }}"
          else
            python download.py --force --latest
          fi
          cat raw/provenance.json
      - name: Build topology and data
        working-directory: pipeline
        run: |
          python build_topology.py
          python build_data.py
      - name: Check new data against the previous build
        working-directory: pipeline
        run: python check_data.py --old /tmp/old_data.js --label "GitHub Actions refresh (run ${{ github.run_number }})"
      - name: Tests
        run: |
          python -m playwright install --with-deps chromium
          python tests/test_pipeline.py
          python tests/smoke_test.py
      - name: Upload refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report
          path: |
            evaluation/refresh_report.md
            pipeline/raw/provenance.json
      - name: Commit new data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add data/ evaluation/refresh_report.md
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Refresh data: $(python -c 'import json;p=json.load(open("pipeline/raw/provenance.json"));print(p["dataset"], p["retrieved"][:10])')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        run: cat evaluation/refresh_report.md >> "$GITHUB_STEP_SUMMARY" || true
  # A push made with GITHUB_TOKEN does not trigger other workflows, so publish from here.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js data vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
